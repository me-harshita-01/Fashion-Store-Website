<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleHub - Fashion Store</title>ls

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h2>STYLEHUB.</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#categories">Categories</a>
            <a href="#about">About</a>
        </nav>

        <div class="icons">
            <span>🔍</span>
            <span>🛍️</span>
        </div>
    </header>


    <!-- Hero Section -->
    <section class="hero" id="home">

        <div class="hero-text">
            <p>NEW COLLECTION 2026</p>

            <h1>Fashion is<br>an attitude.</h1>

            <p>Discover your style with our latest fashion collection.</p>

            <a href="#products" class="shop-btn">SHOP NOW →</a>
        </div>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=800" alt="Fashion collection">
        </div>

    </section>


    <!-- Categories -->
    <section id="categories">

        <h2 class="heading">Shop By Category</h2>

        <div class="category-container">

            <div class="category">
                <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=500" alt="Clothing">
                <h3>Clothing</h3>
            </div>

            <div class="category">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">
                <h3>Footwear</h3>
            </div>

            <div class="category">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Watch">
                <h3>Accessories</h3>
            </div>

        </div>

    </section>


</body>
</html>
